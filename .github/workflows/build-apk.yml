name: Automated Build & Release

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Version
        run: |
          python3 .github/scripts/bump_version.py app/build.gradle
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add app/build.gradle
          git commit -m "chore: automated version bump [skip ci]" || echo "No changes to commit"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        id: build
        run: |
          ./gradlew assembleRelease --no-daemon
          VERSION=$(grep "versionName" app/build.gradle | head -n 1 | sed -E "s/.*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Finalize Version Bump
        if: success()
        run: |
          git push origin devel || echo "Push skipped"

      - name: Rename APK
        run: |
          # With debug signing, the output is app-release.apk, not unsigned
          mv app/build/outputs/apk/release/app-release.apk Tsukimi-v${{ github.run_number }}.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Tsukimi-v${{ github.run_number }}.apk

      - name: Create Release
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }} (v${{ env.APP_VERSION }})
          body: |
            ### Automated Build #${{ github.run_number }}
            - **App Version:** v${{ env.APP_VERSION }}
            - **Status:** Build Successful
            - **Commit:** ${{ github.sha }}
          files: Tsukimi-v${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
